name: ✨ Feature (agreed in Discussions)
description: A feature that's already been discussed and agreed on. For new ideas, start in Discussions → Ideas.
labels: ["enhancement"]
body:
  - type: input
    id: discussion
    attributes:
      label: Link to the discussion
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
