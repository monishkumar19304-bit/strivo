name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: CLI smoke test
        run: |
          strivo --version
          strivo probe --events tests/fixtures/sample_events.jsonl --data "$RUNNER_TEMP/strivo-data"

  image:
    # Multi-arch image. main -> :edge and :sha-…; a v* tag (a release) -> :X.Y.Z and :latest.
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  rules-asset:
    # Every published release carries the compatibility rules so installs can fix themselves (docs/SELF-HEALING.md).
    # Publishing a release is a maintainer decision; this only attaches files to one that was published.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate rules
        run: |
          pip install -e .
          python -c "from strivo import rules; rules.validate(open('src/strivo/rules/compat.json','rb').read()); print('rules ok')"
      - name: Attach compat.json and its checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp src/strivo/rules/compat.json compat.json
          sha256sum compat.json > compat.json.sha256
          gh release upload "${{ github.event.release.tag_name }}" compat.json compat.json.sha256 --clobber
