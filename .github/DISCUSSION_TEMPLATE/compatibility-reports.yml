title: "[Device] "
labels: ["compatibility"]
body:
  - type: input
    id: model
    attributes:
      label: Device model
      placeholder: "e.g. Fire TV Stick 4K Max"
    validations:
      required: true
  - type: textarea
    id: probe
    attributes:
      label: strivo probe output
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
